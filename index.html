<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="古堡賓客區互動遊戲中心：成語猜謎、圖像聯想與限時挑戰。"><title>古堡遊戲中心｜賓客挑戰</title>
<style>
:root{--bg:#111b2a;--panel:#1b2a3d;--gold:#e2c27d;--text:#edf2f8;--muted:#aab8ca;--line:#35465d;--blue:#7ba7d8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#2a4562 0,transparent 38%),var(--bg);color:var(--text);font:16px/1.7 system-ui,"Noto Sans TC",sans-serif}.wrap{max-width:1040px;margin:auto;padding:0 22px}header{border-bottom:1px solid var(--line)}nav{height:70px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:.12em;color:var(--gold);font-size:20px}.navtag{font-size:12px;color:var(--muted)}.hero{padding:55px 0 32px}.eyebrow{font-size:12px;color:var(--gold);letter-spacing:.24em}.hero h1{font-size:clamp(36px,6vw,58px);margin:8px 0}.hero p{color:var(--muted);max-width:650px}.panel{background:#1b2a3deF;border:1px solid var(--line);border-radius:16px;padding:24px;margin:18px 0;box-shadow:0 18px 50px #0003}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.pill{border:1px solid #60758e;border-radius:30px;padding:5px 12px;color:var(--muted);font-size:12px}.prompt{font-size:26px;text-align:center;margin:24px 0 18px}.clues{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.clue{width:92px;height:92px;border-radius:14px;background:#263a52;border:1px solid #506781;display:grid;place-items:center;font-size:42px}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}.choice,button{font:inherit;cursor:pointer;border:1px solid #58708d;background:#263a52;color:var(--text);border-radius:10px;padding:12px}.choice:hover,button:hover{border-color:var(--gold);background:#314b68}.choice:disabled{opacity:.6;cursor:default}.status{min-height:30px;text-align:center;color:var(--gold);margin-top:14px}.bar{height:8px;background:#34475d;border-radius:8px;overflow:hidden;margin-top:12px}.bar>i{display:block;height:100%;width:100%;background:var(--gold);transition:width .3s linear}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.primary{background:var(--gold);color:#172335;border-color:var(--gold);font-weight:700}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.level{padding:18px;background:#1b2a3d;border:1px solid var(--line);border-radius:12px}.level b{color:var(--gold);display:block;font-size:18px}.level p{color:var(--muted);font-size:13px;margin-bottom:0}footer{border-top:1px solid var(--line);padding:24px 0;color:#91a1b4;font-size:13px}
@media(max-width:620px){.choices{grid-template-columns:repeat(2,1fr)}.clue{width:76px;height:76px;font-size:34px}.levels{grid-template-columns:1fr}.panel{padding:17px}}
</style></head><body><header><nav class="wrap"><a class="brand" href="#">古堡遊戲中心</a><span class="navtag">GUEST ZONE · MINI CHALLENGE</span></nav></header>
<main class="wrap"><div class="hero"><div class="eyebrow">CASTLE GAME HALL</div><h1>動動腦，闖關去。</h1><p>從簡單圖像提示開始，逐步加入干擾選項與倒數挑戰。這是古堡賓客區的第一款小遊戲示範，手機與桌面皆可遊玩。</p></div>
<div class="panel"><div class="topline"><span class="pill" id="level">第一關・入門提示</span><span class="pill">得分：<b id="score">0</b></span><span class="pill">時間：<b id="time">不限時</b></span></div>
<div class="prompt" id="question">看圖猜成語</div><div class="clues" id="clues"><div class="clue">🌅</div><div class="clue">🌙</div></div>
<div class="choices" id="choices"><button class="choice" data-answer="日月同輝">日月同輝</button><button class="choice" data-answer="早出晚歸">早出晚歸</button><button class="choice" data-answer="日新月異">日新月異</button><button class="choice" data-answer="風和日麗">風和日麗</button></div>
<div class="status" id="status" aria-live="polite">選出最符合提示的成語！</div><div class="bar"><i id="timerbar"></i></div><div class="controls"><button class="primary" id="next">開始挑戰</button><button id="reset">重新開始</button></div></div>
<section class="levels"><div class="level"><b>第一關｜看圖猜謎</b><p>兩到三張提示圖，熟悉遊戲規則，答對即可晉級。</p></div><div class="level"><b>第二關｜排除干擾</b><p>加入相似圖像與近義選項，考驗觀察與判斷。</p></div><div class="level"><b>第三關｜限時挑戰</b><p>啟動倒數計時，連續答題累積分數，挑戰最高紀錄。</p></div></section>
</main><footer><div class="wrap">古堡遊戲中心 · MVP 示範版 · 後續可擴充題庫、關卡、排行榜與賓客帳號整合</div></footer>
<script>
const rounds=[
 {name:"第一關・入門提示",q:"看圖猜成語",icons:["🌅","🌙"],answers:["日月同輝","早出晚歸","日新月異","風和日麗"],correct:"日月同輝",hint:"日與月同時出現，代表日月同在天空。",seconds:0},
 {name:"第二關・干擾挑戰",q:"哪個成語最符合圖像？",icons:["🌧️","☂️","🌈"],answers:["雨過天晴","風雨同舟","未雨綢繆","晴天霹靂"],correct:"雨過天晴",hint:"雨停之後，天空放晴。",seconds:0},
 {name:"第三關・限時挑戰",q:"限時選出正確成語！",icons:["🐉","🐯"],answers:["龍飛鳳舞","龍爭虎鬥","虎頭蛇尾","如虎添翼"],correct:"龍爭虎鬥",hint:"龍與虎彼此競逐，形容強者爭勝。",seconds:15}
];
let round=0,score=0,started=false,left=0,tick=null,locked=false;
const $=id=>document.getElementById(id);
function render(){const r=rounds[round];$("level").textContent=r.name;$("question").textContent=r.q;$("clues").innerHTML=r.icons.map(x=>'<div class="clue">'+x+'</div>').join("");$("choices").innerHTML=r.answers.map(x=>'<button class="choice" data-answer="'+x+'">'+x+'</button>').join("");$("status").textContent=round===0?"選出最符合提示的成語！":"仔細觀察提示，再選答案。";$("score").textContent=score;$("time").textContent=r.seconds?r.seconds+" 秒":"不限時";$("timerbar").style.width="100%";$("choices").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>answer(b.dataset.answer)));locked=false;}
function stop(){if(tick){clearInterval(tick);tick=null;}}
function start(){stop();started=true;round=0;score=0;render();$("next").textContent="下一關";$("status").textContent="挑戰開始！";beginTimer();}
function beginTimer(){const s=rounds[round].seconds;stop();if(!s){$("time").textContent="不限時";return;}left=s;$("time").textContent=left+" 秒";tick=setInterval(()=>{left--;$("time").textContent=left+" 秒";$("timerbar").style.width=(left/s*100)+"%";if(left<=0){stop();locked=true;$("status").textContent="時間到！正確答案："+rounds[round].correct;$("choices").querySelectorAll("button").forEach(b=>b.disabled=true);$("next").textContent=round===2?"再玩一次":"繼續";}},1000);}
function answer(value){if(locked)return;locked=true;stop();const r=rounds[round];if(value===r.correct){score+=round===2?30:10;$("status").textContent="答對了！"+r.hint;}else{$("status").textContent="再接再厲！答案是「"+r.correct+"」。"+r.hint;} $("score").textContent=score;$("choices").querySelectorAll("button").forEach(b=>{b.disabled=true;if(b.dataset.answer===r.correct)b.style.borderColor="#e2c27d";});$("next").textContent=round===2?"完成挑戰":"下一關";}
$("next").addEventListener("click",()=>{if(!started){start();return;}if(round<2){round++;render();beginTimer();}else{stop();$("status").textContent="本次挑戰完成！總分 "+score+" 分。按「再玩一次」重新挑戰。";$("next").textContent="再玩一次";started=false;}});
$("reset").addEventListener("click",()=>{stop();started=false;round=0;score=0;render();$("next").textContent="開始挑戰";$("status").textContent="已重置，準備好了再開始。";});
render();
</script></body></html>
